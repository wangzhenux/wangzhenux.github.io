<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 130" width="440" height="130" role="img" aria-label="Real priced listings from live inventory beside an honest empty state — a search returning zero matches — shown when nothing is found">
  <rect width="440" height="130" fill="#FAF5E8"/>
  <rect x="10" y="10" width="420" height="110" rx="14" fill="#FFFFFF" stroke="#1A1410" stroke-opacity="0.1"/>

  <!-- real priced listing cards -->
  <g>
    <rect x="26" y="22" width="84" height="78" rx="9" fill="#FFFFFF" stroke="#1A1410" stroke-opacity="0.1"/>
    <rect x="34" y="30" width="68" height="40" rx="8" fill="#E4DAC6"/>
    <rect x="34" y="78" width="34" height="8" rx="4" fill="#1A1410" fill-opacity="0.42"/>
    <rect x="34" y="90" width="58" height="6" rx="3" fill="#1A1410" fill-opacity="0.1"/>
  </g>
  <g>
    <rect x="122" y="22" width="84" height="78" rx="9" fill="#FFFFFF" stroke="#1A1410" stroke-opacity="0.1"/>
    <rect x="130" y="30" width="68" height="40" rx="8" fill="#E4DAC6"/>
    <rect x="130" y="78" width="34" height="8" rx="4" fill="#1A1410" fill-opacity="0.42"/>
    <rect x="130" y="90" width="58" height="6" rx="3" fill="#1A1410" fill-opacity="0.1"/>
  </g>
  <g>
    <rect x="218" y="22" width="84" height="78" rx="9" fill="#FFFFFF" stroke="#1A1410" stroke-opacity="0.1"/>
    <rect x="226" y="30" width="68" height="40" rx="8" fill="#E4DAC6"/>
    <rect x="226" y="78" width="34" height="8" rx="4" fill="#1A1410" fill-opacity="0.42"/>
    <rect x="226" y="90" width="58" height="6" rx="3" fill="#1A1410" fill-opacity="0.1"/>
  </g>

  <!-- divider: real vs. honest empty -->
  <rect x="318" y="24" width="1.5" height="82" fill="#1A1410" fill-opacity="0.1"/>

  <!-- honest empty state: a search that honestly returns 0 matches (never invents one) -->
  <rect x="334" y="22" width="84" height="78" rx="9" fill="none" stroke="#1A1410" stroke-opacity="0.22" stroke-width="1.6" stroke-dasharray="5 5"/>
  <circle cx="360" cy="50" r="9" fill="none" stroke="#1A1410" stroke-opacity="0.45" stroke-width="2"/>
  <path d="M367 57 l7 7" stroke="#1A1410" stroke-opacity="0.45" stroke-width="2.4" stroke-linecap="round"/>
  <text x="392" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#B93A23" text-anchor="middle">0</text>
  <rect x="352" y="80" width="48" height="6" rx="3" fill="#1A1410" fill-opacity="0.12"/>
</svg>
