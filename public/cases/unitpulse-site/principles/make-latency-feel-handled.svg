<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 182" width="320" height="182" role="img" aria-label="A chat where the renter's intent is echoed back and acknowledged, with a live in-progress indicator instead of a dead UI">
  <rect width="320" height="182" fill="#FAF5E8"/>
  <rect x="12" y="12" width="296" height="158" rx="14" fill="#FFFFFF" stroke="#1A1410" stroke-opacity="0.1"/>

  <!-- user intent bubble (right) — echoed intent, acknowledged with a sent tick -->
  <rect x="150" y="30" width="138" height="44" rx="13" fill="#B93A23" fill-opacity="0.1"/>
  <rect x="166" y="43" width="100" height="7" rx="3.5" fill="#1A1410" fill-opacity="0.22"/>
  <rect x="166" y="56" width="64" height="7" rx="3.5" fill="#1A1410" fill-opacity="0.13"/>
  <path d="M267 82 l4.5 4.5 l8 -9" stroke="#B93A23" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- assistant in-progress bubble (left) — live typing dots, never a dead UI -->
  <rect x="32" y="100" width="124" height="46" rx="13" fill="#1A1410" fill-opacity="0.05" stroke="#1A1410" stroke-opacity="0.16"/>
  <circle cx="66" cy="123" r="6.5" fill="#B93A23"/>
  <circle cx="92" cy="123" r="6.5" fill="#B93A23" fill-opacity="0.55"/>
  <circle cx="118" cy="123" r="6.5" fill="#B93A23" fill-opacity="0.28"/>
</svg>
