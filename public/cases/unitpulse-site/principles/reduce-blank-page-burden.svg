<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 182" width="320" height="182" role="img" aria-label="A guided intake card on step one of three, offering selectable options instead of an empty text box">
  <rect width="320" height="182" fill="#FAF5E8"/>
  <rect x="12" y="12" width="296" height="158" rx="14" fill="#FFFFFF" stroke="#1A1410" stroke-opacity="0.1"/>

  <!-- step progress (1 / 3) -->
  <rect x="30" y="30" width="76" height="6" rx="3" fill="#B93A23"/>
  <rect x="114" y="30" width="76" height="6" rx="3" fill="#1A1410" fill-opacity="0.13"/>
  <rect x="198" y="30" width="76" height="6" rx="3" fill="#1A1410" fill-opacity="0.13"/>

  <!-- question -->
  <rect x="30" y="48" width="180" height="9" rx="4.5" fill="#1A1410" fill-opacity="0.24"/>

  <!-- option rows -->
  <rect x="30" y="70" width="18" height="18" rx="4" fill="#B93A23"/>
  <path d="M35 79 l3.5 3.5 l6.5 -7.5" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="58" y="75" width="150" height="8" rx="4" fill="#1A1410" fill-opacity="0.32"/>

  <rect x="30" y="96" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#1A1410" stroke-opacity="0.32"/>
  <rect x="58" y="101" width="130" height="8" rx="4" fill="#1A1410" fill-opacity="0.12"/>

  <rect x="30" y="122" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#1A1410" stroke-opacity="0.32"/>
  <rect x="58" y="127" width="142" height="8" rx="4" fill="#1A1410" fill-opacity="0.12"/>

  <!-- next -->
  <rect x="200" y="142" width="90" height="22" rx="11" fill="#B93A23"/>
  <rect x="216" y="151" width="42" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.9"/>
  <path d="M268 153 h8 m-3 -3 l3 3 -3 3" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
