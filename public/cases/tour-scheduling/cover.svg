<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration: a tour reminder text answered by a one-tap confirm reply">
  <rect width="320" height="200" fill="#EFE7D2"/>
  <!-- incoming reminder bubble (left) -->
  <path d="M40 44 h150 a8 8 0 0 1 8 8 v40 a8 8 0 0 1 -8 8 h-128 l-14 14 v-14 h-8 a8 8 0 0 1 -8 -8 v-40 a8 8 0 0 1 8 -8 Z" fill="#FAF5E8" stroke="#1A1410" stroke-width="2"/>
  <g stroke="#1A141055" stroke-width="2" stroke-linecap="round"><path d="M56 60 H182 M56 73 H168 M56 86 H150"/></g>
  <!-- calendar / tour marker -->
  <g transform="translate(214,46)">
    <rect x="0" y="4" width="40" height="36" rx="4" fill="#FAF5E8" stroke="#1A1410" stroke-width="2"/>
    <line x1="0" y1="15" x2="40" y2="15" stroke="#1A1410" stroke-width="2"/>
    <line x1="11" y1="0" x2="11" y2="9" stroke="#1A1410" stroke-width="2" stroke-linecap="round"/>
    <line x1="29" y1="0" x2="29" y2="9" stroke="#1A1410" stroke-width="2" stroke-linecap="round"/>
    <path d="M14 27 l5 5 l9 -10" fill="none" stroke="#B93A23" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- outgoing reply bubble (right) — the language-agnostic "1" confirm -->
  <path d="M150 120 h112 a8 8 0 0 1 8 8 v30 a8 8 0 0 1 -8 8 h-90 l-14 14 v-14 h-8 a8 8 0 0 1 -8 -8 v-30 a8 8 0 0 1 8 -8 Z" fill="#B93A23"/>
  <text x="172" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#FAF5E8">1</text>
  <g stroke="#FAF5E8" stroke-width="2" stroke-linecap="round" opacity="0.8"><path d="M192 136 H250 M192 149 H236"/></g>
  <!-- confirmed check -->
  <circle cx="64" cy="150" r="13" fill="none" stroke="#1A1410" stroke-width="2"/>
  <path d="M58 150 l5 5 l9 -11" fill="none" stroke="#B93A23" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
