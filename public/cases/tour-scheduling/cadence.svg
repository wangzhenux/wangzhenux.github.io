<svg viewBox="0 0 480 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Message cadence: a booking confirmation on schedule, a 24-hour reminder carrying the confirm ask, and a clean cancellation path">
  <rect width="480" height="150" fill="#EFE7D2"/>
  <!-- baseline -->
  <line x1="58" y1="60" x2="422" y2="60" stroke="#1A141033" stroke-width="2"/>
  <!-- node 1: booking confirmation -->
  <circle cx="80" cy="60" r="7" fill="#FAF5E8" stroke="#1A1410" stroke-width="2"/>
  <path d="M76 60 l3 3 l6 -7" fill="none" stroke="#1A1410" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="92" text-anchor="middle" font-family="system-ui, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1A1410">Booking</text>
  <text x="80" y="106" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#1A141099">on schedule</text>
  <!-- node 2: 24-hr reminder w/ confirm (accent) -->
  <circle cx="240" cy="60" r="9" fill="#B93A23"/>
  <text x="240" y="64" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#FAF5E8">1</text>
  <text x="240" y="94" text-anchor="middle" font-family="system-ui, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1A1410">24-hr reminder</text>
  <text x="240" y="108" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#B93A23">carries the confirm ask</text>
  <!-- node 3: cancellation -->
  <circle cx="400" cy="60" r="7" fill="#FAF5E8" stroke="#1A1410" stroke-width="2"/>
  <path d="M396 56 l8 8 M404 56 l-8 8" stroke="#1A141088" stroke-width="2" stroke-linecap="round"/>
  <text x="400" y="92" text-anchor="middle" font-family="system-ui, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1A1410">Cancellation</text>
  <text x="400" y="106" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#1A141099">a clean path out</text>
</svg>
