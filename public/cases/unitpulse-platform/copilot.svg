<svg viewBox="0 0 460 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Copilot: a CRM page on the left, a chat sidebar on the right with a typed command, a working-on-it state, and a generated result card">
  <rect width="460" height="240" fill="#EFE7D2"/>
  <!-- CRM page skeleton (left) -->
  <rect x="20" y="24" width="268" height="192" rx="8" fill="#FAF5E8" stroke="#1A1410" stroke-width="2"/>
  <line x1="20" y1="50" x2="288" y2="50" stroke="#1A1410" stroke-width="2"/>
  <circle cx="36" cy="37" r="3.5" fill="#1A1410"/>
  <g stroke="#1A141055" stroke-width="2" stroke-linecap="round"><path d="M40 74 H150 M40 90 H120"/></g>
  <!-- a little data table -->
  <rect x="40" y="110" width="208" height="86" rx="4" fill="#EFE7D2" stroke="#1A141033" stroke-width="1.5"/>
  <line x1="40" y1="134" x2="248" y2="134" stroke="#1A141033" stroke-width="1.5"/>
  <line x1="40" y1="158" x2="248" y2="158" stroke="#1A141022" stroke-width="1.5"/>
  <line x1="40" y1="180" x2="248" y2="180" stroke="#1A141022" stroke-width="1.5"/>
  <line x1="110" y1="110" x2="110" y2="196" stroke="#1A141022" stroke-width="1.5"/>
  <line x1="180" y1="110" x2="180" y2="196" stroke="#1A141022" stroke-width="1.5"/>
  <!-- chat sidebar (right) -->
  <rect x="300" y="24" width="140" height="192" rx="8" fill="#FAF5E8" stroke="#1A1410" stroke-width="2"/>
  <!-- user command bubble -->
  <rect x="324" y="40" width="100" height="30" rx="8" fill="#B93A23"/>
  <g stroke="#FAF5E8" stroke-width="2" stroke-linecap="round" opacity="0.85"><path d="M336 52 H412 M336 62 H392"/></g>
  <!-- working on it -->
  <g><circle cx="318" cy="92" r="2.6" fill="#1A141066"/><circle cx="328" cy="92" r="2.6" fill="#1A141044"/><circle cx="338" cy="92" r="2.6" fill="#1A14102a"/>
  <text x="350" y="96" font-family="ui-monospace, Menlo, monospace" font-size="8" fill="#1A141088">working…</text></g>
  <!-- generated result card -->
  <rect x="314" y="112" width="112" height="92" rx="6" fill="#EFE7D2" stroke="#1A1410" stroke-width="1.8"/>
  <g fill="#1A1410"><rect x="326" y="166" width="9" height="22"/><rect x="340" y="156" width="9" height="32"/></g>
  <rect x="354" y="162" width="9" height="26" fill="#B93A23"/>
  <g stroke="#1A141055" stroke-width="1.6" stroke-linecap="round"><path d="M326 128 H392 M326 140 H378"/></g>
  <line x1="314" y1="150" x2="426" y2="150" stroke="#1A141022" stroke-width="1.5"/>
</svg>
