<svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The merge: three separate login screens collapsing into one authenticated portal shell">
  <rect width="480" height="220" fill="#EFE7D2"/>
  <!-- three fanned login cards (before), muted -->
  <g>
    <g transform="rotate(-8 90 120)" opacity="0.55">
      <rect x="46" y="78" width="88" height="104" rx="8" fill="#FAF5E8" stroke="#1A1410" stroke-width="2"/>
      <circle cx="90" cy="108" r="9" fill="none" stroke="#1A1410" stroke-width="2"/><rect x="83" y="116" width="14" height="11" rx="2" fill="#1A1410"/>
      <rect x="62" y="140" width="56" height="9" rx="4" fill="#1A141033"/>
      <rect x="62" y="156" width="56" height="9" rx="4" fill="#1A141033"/>
    </g>
    <g transform="rotate(-2 110 116)" opacity="0.75">
      <rect x="66" y="70" width="88" height="104" rx="8" fill="#FAF5E8" stroke="#1A1410" stroke-width="2"/>
      <circle cx="110" cy="100" r="9" fill="none" stroke="#1A1410" stroke-width="2"/><rect x="103" y="108" width="14" height="11" rx="2" fill="#1A1410"/>
      <rect x="82" y="132" width="56" height="9" rx="4" fill="#1A141033"/>
      <rect x="82" y="148" width="56" height="9" rx="4" fill="#1A141033"/>
    </g>
    <g transform="rotate(4 134 112)">
      <rect x="90" y="62" width="88" height="104" rx="8" fill="#FAF5E8" stroke="#1A1410" stroke-width="2"/>
      <circle cx="134" cy="92" r="9" fill="none" stroke="#1A1410" stroke-width="2"/><rect x="127" y="100" width="14" height="11" rx="2" fill="#1A1410"/>
      <rect x="106" y="124" width="56" height="9" rx="4" fill="#1A141055"/>
      <rect x="106" y="140" width="56" height="9" rx="4" fill="#1A141055"/>
    </g>
  </g>
  <!-- arrow -->
  <g stroke="#B93A23" stroke-width="3" fill="#B93A23"><path d="M212 110 H262" stroke-linecap="round"/><path d="M258 103 l10 7 l-10 7 Z"/></g>
  <!-- one unified portal shell (after) -->
  <rect x="290" y="46" width="170" height="128" rx="10" fill="#FAF5E8" stroke="#B93A23" stroke-width="2.4"/>
  <line x1="290" y1="68" x2="460" y2="68" stroke="#1A1410" stroke-width="2"/>
  <circle cx="304" cy="57" r="3" fill="#B93A23"/>
  <line x1="328" y1="68" x2="328" y2="174" stroke="#1A141033" stroke-width="1.5"/>
  <g fill="#1A141066"><circle cx="309" cy="90" r="3"/><circle cx="309" cy="106" r="3"/><circle cx="309" cy="122" r="3"/></g>
  <g stroke="#1A141055" stroke-width="2" stroke-linecap="round"><path d="M344 92 H440 M344 110 H424 M344 128 H440 M344 146 H418"/></g>
</svg>
