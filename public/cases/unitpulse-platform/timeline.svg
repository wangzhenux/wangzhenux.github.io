<svg viewBox="0 0 480 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline: kickoff from zero in February 2026, first customer on the marketing product in March, three products live by spring, converged into one platform by summer">
  <rect width="480" height="160" fill="#EFE7D2"/>

  <!-- Spine: ink through the build-out, accent through the convergence -->
  <line x1="24" y1="118" x2="302" y2="118" stroke="#1A1410" stroke-width="2"/>
  <line x1="302" y1="118" x2="448" y2="118" stroke="#B93A23" stroke-width="2"/>
  <path d="M448 114 l9 4 l-9 4 z" fill="#B93A23"/>

  <!-- Station nodes -->
  <circle cx="78" cy="118" r="3.5" fill="#1A1410"/>
  <circle cx="190" cy="118" r="3.5" fill="#1A1410"/>
  <circle cx="302" cy="118" r="3.5" fill="#1A1410"/>
  <circle cx="414" cy="118" r="4" fill="#B93A23"/>

  <!-- Feb 2026: kickoff from zero — a dashed tile -->
  <rect x="60" y="52" width="36" height="26" rx="4" fill="#FAF5E8" stroke="#1A1410" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="78" y="96" text-anchor="middle" font-family="system-ui, Helvetica, Arial, sans-serif" font-size="10" fill="#1A1410">Kickoff, from zero</text>
  <text x="78" y="138" text-anchor="middle" font-family="system-ui, Helvetica, Arial, sans-serif" font-size="10" fill="#1A1410" opacity="0.55">Feb 2026</text>

  <!-- Mar 2026: first customer (Marketing) — a tile with a check -->
  <rect x="172" y="52" width="36" height="26" rx="4" fill="#FAF5E8" stroke="#1A1410" stroke-width="2"/>
  <path d="M183 65 l5 5 l9 -10" fill="none" stroke="#B93A23" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="190" y="96" text-anchor="middle" font-family="system-ui, Helvetica, Arial, sans-serif" font-size="10" fill="#1A1410">First customer</text>
  <text x="190" y="138" text-anchor="middle" font-family="system-ui, Helvetica, Arial, sans-serif" font-size="10" fill="#1A1410" opacity="0.55">Mar 2026</text>

  <!-- Spring 2026: three products live — three small tiles -->
  <rect x="272" y="54" width="16" height="22" rx="3" fill="#FAF5E8" stroke="#1A1410" stroke-width="2"/>
  <rect x="294" y="54" width="16" height="22" rx="3" fill="#FAF5E8" stroke="#1A1410" stroke-width="2"/>
  <rect x="316" y="54" width="16" height="22" rx="3" fill="#FAF5E8" stroke="#1A1410" stroke-width="2"/>
  <text x="302" y="96" text-anchor="middle" font-family="system-ui, Helvetica, Arial, sans-serif" font-size="10" fill="#1A1410">3 products live</text>
  <text x="302" y="138" text-anchor="middle" font-family="system-ui, Helvetica, Arial, sans-serif" font-size="10" fill="#1A1410" opacity="0.55">Spring 2026</text>

  <!-- Summer 2026: one platform — one accent tile holding the three -->
  <rect x="390" y="48" width="48" height="32" rx="5" fill="#FAF5E8" stroke="#B93A23" stroke-width="2.2"/>
  <g stroke="#1A1410" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M400 56 V72"/>
    <path d="M414 56 V72"/>
    <path d="M428 56 V72"/>
  </g>
  <text x="414" y="98" text-anchor="middle" font-family="Georgia, serif" font-size="12.5" font-style="italic" fill="#B93A23">One platform</text>
  <text x="414" y="138" text-anchor="middle" font-family="system-ui, Helvetica, Arial, sans-serif" font-size="10" fill="#1A1410" opacity="0.55">Summer 2026</text>
</svg>
