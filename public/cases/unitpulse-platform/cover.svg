<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three product tiles whose flows merge into a single line feeding one unified platform shell">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33291A"/>
      <stop offset="1" stop-color="#140F08"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#g)"/>

  <!-- flows drawn FIRST so the boxes sit on top: three lines emerge from behind
       the tiles, converge to one junction, and continue as a single trunk -->
  <g stroke="#E0573E" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M60 61 C 112 61, 116 101, 150 101"/>
    <path d="M60 101 H150"/>
    <path d="M60 141 C 112 141, 116 101, 150 101"/>
  </g>
  <circle cx="150" cy="101" r="3.4" fill="#E0573E"/>
  <line x1="150" y1="101" x2="166" y2="101" stroke="#E0573E" stroke-width="3" stroke-linecap="round"/>
  <path d="M164 95 l10 6 l-10 6 Z" fill="#E0573E"/>

  <!-- three product tiles (panel fill occludes the line starts behind them) -->
  <g>
    <rect x="30" y="46" width="60" height="30" rx="6" fill="#241B0F" stroke="#FAF5E8" stroke-width="1.8"/>
    <rect x="30" y="86" width="60" height="30" rx="6" fill="#241B0F" stroke="#FAF5E8" stroke-width="1.8"/>
    <rect x="30" y="126" width="60" height="30" rx="6" fill="#241B0F" stroke="#FAF5E8" stroke-width="1.8"/>
  </g>
  <g fill="#FAF5E8" opacity="0.85"><circle cx="46" cy="61" r="2.6"/><circle cx="46" cy="101" r="2.6"/><circle cx="46" cy="141" r="2.6"/></g>

  <!-- one unified platform shell -->
  <rect x="180" y="46" width="116" height="108" rx="9" fill="#FAF5E8" fill-opacity="0.05" stroke="#FAF5E8" stroke-width="1.8"/>
  <line x1="206" y1="46" x2="206" y2="154" stroke="#FAF5E8" stroke-width="1" opacity="0.4"/>
  <g fill="#FAF5E8" opacity="0.6"><circle cx="193" cy="64" r="2.4"/><circle cx="193" cy="80" r="2.4"/><circle cx="193" cy="96" r="2.4"/></g>
  <g fill="none" stroke="#FAF5E8" stroke-width="1.5" opacity="0.85">
    <rect x="218" y="62" width="64" height="18" rx="4"/>
    <rect x="226" y="88" width="56" height="18" rx="4"/>
    <rect x="234" y="114" width="48" height="18" rx="4"/>
  </g>
  <rect x="218" y="140" width="64" height="2.6" rx="1.3" fill="#E0573E"/>
</svg>
