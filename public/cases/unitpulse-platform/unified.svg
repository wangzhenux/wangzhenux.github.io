<svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="After: one platform shell, one login, a Find to Convert to Measure funnel, with a Copilot command bar spanning all three">
  <rect width="480" height="220" fill="#EFE7D2"/>
  <!-- one aligned platform shell -->
  <rect x="28" y="24" width="424" height="172" rx="10" fill="#FAF5E8" stroke="#1A1410" stroke-width="2"/>
  <!-- left nav -->
  <line x1="92" y1="24" x2="92" y2="196" stroke="#1A141033" stroke-width="1.5"/>
  <circle cx="60" cy="48" r="4" fill="#B93A23"/>
  <g fill="#1A141066"><circle cx="60" cy="72" r="3.5"/><circle cx="60" cy="92" r="3.5"/><circle cx="60" cy="112" r="3.5"/></g>
  <!-- Find -> Convert -> Measure funnel, left to right -->
  <g font-family="system-ui, Helvetica, Arial, sans-serif" font-size="11" fill="#1A1410" text-anchor="middle">
    <rect x="118" y="64" width="80" height="48" rx="6" fill="#EFE7D2" stroke="#1A1410" stroke-width="1.8"/>
    <text x="158" y="92">Find</text>
    <rect x="226" y="64" width="80" height="48" rx="6" fill="#EFE7D2" stroke="#1A1410" stroke-width="1.8"/>
    <text x="266" y="92">Convert</text>
    <rect x="334" y="64" width="80" height="48" rx="6" fill="#EFE7D2" stroke="#1A1410" stroke-width="1.8"/>
    <text x="374" y="92">Measure</text>
  </g>
  <!-- accent connectors signal cohesion -->
  <g stroke="#B93A23" stroke-width="2.4" fill="#B93A23">
    <path d="M198 88 H222" stroke-linecap="round"/><path d="M220 84 l6 4 l-6 4 Z"/>
    <path d="M306 88 H330" stroke-linecap="round"/><path d="M328 84 l6 4 l-6 4 Z"/>
  </g>
  <!-- Copilot command bar spanning the funnel, touching all three -->
  <g stroke="#B93A2355" stroke-width="1.5" stroke-dasharray="2 4"><path d="M158 112 V150 M266 112 V150 M374 112 V150"/></g>
  <rect x="118" y="150" width="296" height="30" rx="15" fill="#FAF5E8" stroke="#B93A23" stroke-width="2"/>
  <circle cx="138" cy="165" r="8" fill="#B93A23"/><circle cx="135" cy="163.5" r="1.4" fill="#FAF5E8"/><circle cx="141" cy="163.5" r="1.4" fill="#FAF5E8"/>
  <text x="156" y="169" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#1A141099">Copilot — one command layer</text>
</svg>
