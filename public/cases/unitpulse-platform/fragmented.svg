<svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Before: three separate apps, each with its own login, and AI bots with no shared front door — broken links between them">
  <rect width="480" height="220" fill="#EFE7D2"/>

  <!-- broken dashed connectors (drawn first, behind) — they never join -->
  <g stroke="#1A141055" stroke-width="1.6" fill="none" stroke-dasharray="3 5" stroke-linecap="round">
    <path d="M150 88 H188"/>
    <path d="M214 96 H236"/>
    <path d="M304 110 H328"/>
    <path d="M356 92 H372"/>
  </g>
  <!-- break marks on the gaps -->
  <g stroke="#B93A23" stroke-width="1.8" stroke-linecap="round">
    <path d="M198 84 l8 8 M206 84 l-8 8"/>
    <path d="M340 100 l8 8 M348 100 l-8 8"/>
  </g>

  <!-- three separate app windows (subtle misalignment) -->
  <!-- A -->
  <g>
    <rect x="22" y="40" width="128" height="80" rx="6" fill="#FAF5E8" stroke="#1A1410" stroke-width="2"/>
    <line x1="22" y1="60" x2="150" y2="60" stroke="#1A1410" stroke-width="2"/>
    <circle cx="36" cy="50" r="3" fill="#1A1410"/>
    <g stroke="#1A141055" stroke-width="2" stroke-linecap="round"><path d="M36 76 H120 M36 90 H104 M36 104 H126"/></g>
    <g transform="translate(128,30)"><rect x="0" y="6" width="16" height="11" rx="2" fill="#FAF5E8" stroke="#1A1410" stroke-width="1.8"/><path d="M3.5 6 V4 a4.5 4.5 0 0 1 9 0 V6" fill="none" stroke="#1A1410" stroke-width="1.8"/></g>
  </g>
  <!-- B (lower) -->
  <g>
    <rect x="176" y="70" width="128" height="80" rx="6" fill="#FAF5E8" stroke="#1A1410" stroke-width="2"/>
    <line x1="176" y1="90" x2="304" y2="90" stroke="#1A1410" stroke-width="2"/>
    <circle cx="190" cy="80" r="3" fill="#1A1410"/>
    <g stroke="#1A141055" stroke-width="2" stroke-linecap="round"><path d="M190 106 H274 M190 120 H258 M190 134 H280"/></g>
    <g transform="translate(282,60)"><rect x="0" y="6" width="16" height="11" rx="2" fill="#FAF5E8" stroke="#1A1410" stroke-width="1.8"/><path d="M3.5 6 V4 a4.5 4.5 0 0 1 9 0 V6" fill="none" stroke="#1A1410" stroke-width="1.8"/></g>
  </g>
  <!-- C -->
  <g>
    <rect x="330" y="44" width="128" height="80" rx="6" fill="#FAF5E8" stroke="#1A1410" stroke-width="2"/>
    <line x1="330" y1="64" x2="458" y2="64" stroke="#1A1410" stroke-width="2"/>
    <circle cx="344" cy="54" r="3" fill="#1A1410"/>
    <g stroke="#1A141055" stroke-width="2" stroke-linecap="round"><path d="M344 80 H428 M344 94 H412 M344 108 H434"/></g>
    <g transform="translate(436,34)"><rect x="0" y="6" width="16" height="11" rx="2" fill="#FAF5E8" stroke="#1A1410" stroke-width="1.8"/><path d="M3.5 6 V4 a4.5 4.5 0 0 1 9 0 V6" fill="none" stroke="#1A1410" stroke-width="1.8"/></g>
  </g>

  <!-- a disconnected AI bot chip, floating, with broken links -->
  <g transform="translate(214,168)">
    <rect x="0" y="0" width="52" height="34" rx="8" fill="#EFE7D2" stroke="#B93A23" stroke-width="2"/>
    <circle cx="18" cy="17" r="2.4" fill="#B93A23"/><circle cx="26" cy="17" r="2.4" fill="#B93A23"/><circle cx="34" cy="17" r="2.4" fill="#B93A23"/>
  </g>
  <g stroke="#1A141055" stroke-width="1.6" fill="none" stroke-dasharray="3 5" stroke-linecap="round">
    <path d="M226 168 Q220 150 212 142"/>
    <path d="M256 168 Q286 156 300 150"/>
  </g>
</svg>
