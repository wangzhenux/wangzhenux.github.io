<svg viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Before: three separate apps, each with its own login and its own siloed AI, divided by friction at the seams — no shared front door">
  <rect width="480" height="220" fill="#EFE7D2"/>

  <!-- three separate app windows, clear gaps, no connecting lines -->
  <!-- A -->
  <g>
    <rect x="20" y="56" width="126" height="104" rx="7" fill="#FAF5E8" stroke="#1A1410" stroke-width="2"/>
    <line x1="20" y1="80" x2="146" y2="80" stroke="#1A1410" stroke-width="2"/>
    <circle cx="35" cy="68" r="3" fill="#1A1410"/>
    <g stroke="#1A141055" stroke-width="2" stroke-linecap="round"><path d="M35 100 H118 M35 116 H100 M35 132 H122"/></g>
    <!-- siloed AI sparkle -->
    <g transform="translate(124,104)" fill="#1A1410"><path d="M0 -7 C 0.9 -2.7, 2.7 -0.9, 7 0 C 2.7 0.9, 0.9 2.7, 0 7 C -0.9 2.7, -2.7 0.9, -7 0 C -2.7 -0.9, -0.9 -2.7, 0 -7 Z"/></g>
  </g>
  <!-- B -->
  <g>
    <rect x="177" y="56" width="126" height="104" rx="7" fill="#FAF5E8" stroke="#1A1410" stroke-width="2"/>
    <line x1="177" y1="80" x2="303" y2="80" stroke="#1A1410" stroke-width="2"/>
    <circle cx="192" cy="68" r="3" fill="#1A1410"/>
    <g stroke="#1A141055" stroke-width="2" stroke-linecap="round"><path d="M192 102 H276 M192 118 H250"/></g>
    <rect x="192" y="130" width="40" height="14" rx="3" fill="none" stroke="#1A141044" stroke-width="1.6"/>
    <g transform="translate(281,140)" fill="#1A1410"><path d="M0 -7 C 0.9 -2.7, 2.7 -0.9, 7 0 C 2.7 0.9, 0.9 2.7, 0 7 C -0.9 2.7, -2.7 0.9, -7 0 C -2.7 -0.9, -0.9 -2.7, 0 -7 Z"/></g>
  </g>
  <!-- C -->
  <g>
    <rect x="334" y="56" width="126" height="104" rx="7" fill="#FAF5E8" stroke="#1A1410" stroke-width="2"/>
    <line x1="334" y1="80" x2="460" y2="80" stroke="#1A1410" stroke-width="2"/>
    <circle cx="349" cy="68" r="3" fill="#1A1410"/>
    <g stroke="#1A141055" stroke-width="2" stroke-linecap="round"><path d="M349 100 H432 M349 116 H414 M349 132 H424"/></g>
    <g transform="translate(438,104)" fill="#1A1410"><path d="M0 -7 C 0.9 -2.7, 2.7 -0.9, 7 0 C 2.7 0.9, 0.9 2.7, 0 7 C -0.9 2.7, -2.7 0.9, -7 0 C -2.7 -0.9, -0.9 -2.7, 0 -7 Z"/></g>
  </g>

  <!-- three keys: one login per app -->
  <g stroke="#1A1410" stroke-width="2" stroke-linecap="round" fill="none">
    <g transform="translate(83,30)"><circle cx="0" cy="0" r="5.5" fill="#FAF5E8"/><path d="M0 5.5 V20 M0 13 H5 M0 18 H4"/></g>
    <g transform="translate(240,30)"><circle cx="0" cy="0" r="5.5" fill="#FAF5E8"/><path d="M0 5.5 V20 M0 13 H5 M0 18 H4"/></g>
    <g transform="translate(397,30)"><circle cx="0" cy="0" r="5.5" fill="#FAF5E8"/><path d="M0 5.5 V20 M0 13 H5 M0 18 H4"/></g>
  </g>

  <!-- friction at the seams: torn gaps between the apps (no connection) -->
  <g stroke="#B93A23" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
    <path d="M161 92 l8 10 l-8 11 l8 11"/>
    <path d="M318 92 l8 10 l-8 11 l8 11"/>
  </g>
</svg>
