<!doctype html>
<!-- Composed wall tile: 2 donut cards (legend + solo readout), lifted from
     preview/charts-donut.html at a fixed 700px tile width. Token-only colors. -->
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--cream); color: var(--ink); font-family: var(--font-sans); }
  .tile { padding: 24px 28px; width: 700px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 14px; }
  .card { background: var(--paper); border: 1px solid var(--hairline); border-radius: var(--r-card); padding: 18px 20px; box-sizing: border-box; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .card-title { font-family: var(--font-display); font-size: var(--t-h3); font-weight: 600; letter-spacing: -0.028em; margin: 0; }
  .card-meta { font-family: var(--font-mono); font-size: var(--t-mono); color: var(--faint); }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: var(--t-mono); color: var(--subtle); line-height: 1.9; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex-shrink: 0; }
  .donut-row { display: flex; align-items: center; gap: 18px; }
  .donut-row svg { flex: 0 0 auto; }
  .donut-solo { position: relative; width: 160px; height: 160px; margin: 0 auto; }
  .donut-solo svg { width: 160px; height: 160px; }
  .readout {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; text-align: center;
  }
  .readout .val { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: -0.02em; font-feature-settings: "tnum"; line-height: 1; }
  .readout .lbl { font-family: var(--font-mono); font-size: var(--t-mono); color: var(--faint); margin-top: 5px; letter-spacing: 0.08em; text-transform: uppercase; }
</style>
<script>
  const t = new URLSearchParams(location.search).get('theme');
  if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
</script>
</head><body>
<div class="tile">

  <div class="card">
    <div class="card-head">
      <h3 class="card-title">Lead sources</h3>
      <span class="card-meta">April</span>
    </div>
    <div class="donut-row">
      <svg width="132" height="132" viewBox="0 0 180 180" fill="none">
        <circle cx="90" cy="90" r="54" stroke="var(--forest)" stroke-width="26"
          stroke-dasharray="142.5 216.8" stroke-dashoffset="0" transform="rotate(-90 90 90)"/>
        <circle cx="90" cy="90" r="54" stroke="var(--moss)" stroke-width="26"
          stroke-dasharray="79.2 280.1" stroke-dashoffset="-142.5" transform="rotate(-90 90 90)"/>
        <circle cx="90" cy="90" r="54" stroke="var(--sage)" stroke-width="26"
          stroke-dasharray="50.4 308.9" stroke-dashoffset="-221.7" transform="rotate(-90 90 90)"/>
        <circle cx="90" cy="90" r="54" stroke="var(--mintRing)" stroke-width="26"
          stroke-dasharray="36 303.3" stroke-dashoffset="-272.1" transform="rotate(-90 90 90)"/>
        <circle cx="90" cy="90" r="54" stroke="var(--cream3)" stroke-width="26"
          stroke-dasharray="43.2 296.1" stroke-dashoffset="-308.1" transform="rotate(-90 90 90)"/>
      </svg>
      <div>
        <div class="legend-item"><span class="legend-swatch" style="background:var(--forest)"></span>Direct 42%</div>
        <div class="legend-item"><span class="legend-swatch" style="background:var(--moss)"></span>Zillow 22%</div>
        <div class="legend-item"><span class="legend-swatch" style="background:var(--sage)"></span>Referral 14%</div>
        <div class="legend-item"><span class="legend-swatch" style="background:var(--mintRing)"></span>Apts.com 10%</div>
        <div class="legend-item"><span class="legend-swatch" style="background:var(--cream3)"></span>Other 12%</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h3 class="card-title">Occupancy</h3>
      <span class="card-meta">Live</span>
    </div>
    <div class="donut-solo">
      <svg viewBox="0 0 180 180" fill="none">
        <circle cx="90" cy="90" r="64" stroke="var(--cream3)" stroke-width="22"/>
        <circle cx="90" cy="90" r="64" stroke="var(--forest)" stroke-width="22"
          stroke-dasharray="389.2 402.1" stroke-linecap="round" transform="rotate(-90 90 90)"/>
      </svg>
      <div class="readout">
        <div class="val">96.8<span style="font-size:0.5em;color:var(--faint);margin-left:1px">%</span></div>
        <div class="lbl">Occupied</div>
      </div>
    </div>
  </div>

</div>
</body></html>
