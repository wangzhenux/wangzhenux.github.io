<!doctype html>
<!-- Composed wall tile: button states + intents, lifted from preview/components-buttons.html
     (Focus strip omitted — it hard-codes the pre-olive focus ring). Token-only colors so
     ?theme=dark renders correctly. -->
<html><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--cream); }
  .tile { padding: 24px 28px; width: 700px; }
  .label-sm { font-size: var(--t-eyebrow); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); margin: 18px 0 8px; }
  .label-sm:first-child { margin-top: 0; }
  .col-label { font-family: var(--font-mono); font-size: var(--t-eyebrow); color: var(--faint); width: 70px; flex-shrink: 0; }
  .strip { display: flex; align-items: center; gap: 12px; padding: 7px 0; flex-wrap: wrap; }
</style>
<script>
  const t = new URLSearchParams(location.search).get('theme');
  if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
</script>
</head><body>
<div class="tile">
  <div class="label-sm">Primary · ghost · link</div>
  <div class="strip"><span class="col-label">Default</span>
    <button class="btn-primary"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M6 2.25v7.5M2.25 6h7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Add property</button>
    <button class="btn-ghost">Export PDF</button>
    <button class="btn-link">View details</button>
  </div>
  <div class="strip"><span class="col-label">Hover</span>
    <button class="btn-primary" style="background:var(--forest2);border-color:var(--forest2)"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M6 2.25v7.5M2.25 6h7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Add property</button>
    <button class="btn-ghost" style="border-color:var(--forest)">Export PDF</button>
  </div>
  <div class="strip"><span class="col-label">Loading</span>
    <button class="btn-primary" disabled style="opacity:1"><span class="spinner"></span>Saving…</button>
    <button class="btn-ghost" disabled style="opacity:1"><span class="spinner spinner-dark"></span>Syncing…</button>
  </div>
  <div class="strip"><span class="col-label">Disabled</span>
    <button class="btn-primary" disabled><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M6 2.25v7.5M2.25 6h7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Add property</button>
    <button class="btn-ghost" disabled>Export PDF</button>
    <button class="btn-link" disabled>View details</button>
  </div>

  <div class="label-sm">Danger &amp; AI intents</div>
  <div class="strip"><span class="col-label">Danger</span>
    <button class="btn-primary btn-danger"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Delete property</button>
    <button class="btn-ghost btn-danger">Remove</button>
    <button class="btn-link btn-danger">Cancel lease</button>
  </div>
  <div class="strip"><span class="col-label">AI</span>
    <button class="btn-primary btn-ai"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M6 1.5l1.2 2.6L10 5l-2.6 1.2L6 9 4.8 6.4 2 5.2l2.6-1.1L6 1.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" fill="none"/></svg>Draft reply</button>
    <button class="btn-ghost btn-ai"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M6 1.5l1.2 2.6L10 5l-2.6 1.2L6 9 4.8 6.4 2 5.2l2.6-1.1L6 1.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" fill="none"/></svg>Summarize</button>
    <button class="btn-link btn-ai">Explain this</button>
  </div>
</div>
</body></html>
